name: Temporary Basemap Switch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch map view
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/camp_management/map.blade.php')
          text = path.read_text(encoding='utf-8')

          old = "        const map = L.map('map').setView([31.52, 34.44], 13);\n        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);"
          new = """        const map = L.map('map').setView([31.52, 34.44], 13);

        // ===== BASEMAPS =====
        const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        });
        const satelliteBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        osmBase.addTo(map);

        const basemapControl = L.control({ position: 'topright' });
        basemapControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'basemap-switcher');
            div.innerHTML = `
                <div class=\"basemap-switcher-title\">الخريطة</div>
                <button type=\"button\" class=\"basemap-btn active\" data-basemap=\"osm\">🗺️ OpenStreetMap</button>
                <button type=\"button\" class=\"basemap-btn\" data-basemap=\"satellite\">🛰️ صورة جوية</button>
            `;

            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            div.querySelectorAll('.basemap-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const selected = button.dataset.basemap;
                    if (selected === 'satellite') {
                        if (map.hasLayer(osmBase)) map.removeLayer(osmBase);
                        if (!map.hasLayer(satelliteBase)) satelliteBase.addTo(map);
                    } else {
                        if (map.hasLayer(satelliteBase)) map.removeLayer(satelliteBase);
                        if (!map.hasLayer(osmBase)) osmBase.addTo(map);
                    }

                    div.querySelectorAll('.basemap-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });

            return div;
        };
        basemapControl.addTo(map);"""

          if old not in text:
              raise SystemExit('Target basemap code not found; refusing to modify the file.')

          text = text.replace(old, new, 1)

          marker = """        /* ===== Popup ===== */
"""
          css = """        /* ===== Basemap switcher ===== */
        .basemap-switcher {
            background: rgba(255, 255, 255, .97);
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            min-width: 150px;
        }

        .basemap-switcher-title {
            font-size: 11px;
            font-weight: 800;
            color: #1e3a5f;
            margin: 0 2px 6px;
        }

        .basemap-btn {
            display: block;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            background: #fff;
            color: #475569;
            padding: 6px 8px;
            margin: 3px 0;
            text-align: right;
            font-family: 'Cairo', sans-serif;
            font-size: 11px;
            cursor: pointer;
        }

        .basemap-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .basemap-btn.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1d4ed8;
            font-weight: 700;
        }

"""
          if marker not in text:
              raise SystemExit('CSS insertion marker not found; refusing to modify the file.')
          text = text.replace(marker, css + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit map-only change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temporary-basemap-switch.yml
          git add resources/views/camp_management/map.blade.php .github/workflows/temporary-basemap-switch.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add OSM and satellite basemap switcher"
          git push
