name: Apply aid request heatmap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch map controller
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/Http/Controllers/MapController.php')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'use App\\Models\\Hospital;\n',
              'use App\\Models\\Hospital;\nuse App\\Models\\FamilyAidAllocation;\n',
              1,
          )

          old = '''        $hospitals = Hospital::active()\n            ->whereNotNull('latitude')\n            ->whereNotNull('longitude')\n            ->get();\n\n        $html = view('camp_management.map', compact('camps', 'hospitals'))->render();'''
          new = '''        $hospitals = Hospital::active()\n            ->whereNotNull('latitude')\n            ->whereNotNull('longitude')\n            ->get();\n\n        // Pending family aid allocations represent current aid requests.\n        // Aggregate them by camp for the GIS heatmap.\n        $aidRequests = FamilyAidAllocation::query()\n            ->selectRaw('guardians.camp_id as camp_id, COUNT(*) as request_count')\n            ->join('guardians', 'family_aid_allocations.guardian_id', '=', 'guardians.id')\n            ->where('family_aid_allocations.receipt_status', FamilyAidAllocation::STATUS_PENDING)\n            ->whereNull('family_aid_allocations.deleted_at')\n            ->groupBy('guardians.camp_id')\n            ->get()\n            ->map(fn ($item) => [\n                'camp_id' => (int) $item->camp_id,\n                'request_count' => (int) $item->request_count,\n            ])\n            ->values();\n\n        $aidRequestsScript = '<script>window.CAMP_AID_REQUESTS = ' . json_encode($aidRequests, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . ';</script>';\n\n        $html = view('camp_management.map', compact('camps', 'hospitals'))->render();'''
          if old not in text:
              raise SystemExit('Expected MapController index block was not found')
          text = text.replace(old, new, 1)

          old = '''        $basemapScript = <<<'HTML'\n<script src="https://cdn.jsdelivr.net/npm/proj4@2.19.10/dist/proj4.js"></script>'''
          new = '''        $basemapScript = $aidRequestsScript . <<<'HTML'\n<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/proj4@2.19.10/dist/proj4.js"></script>'''
          if old not in text:
              raise SystemExit('Expected basemap script block was not found')
          text = text.replace(old, new, 1)

          marker = '''        L.Map.addInitHook(function () {\n            const mapInstance = this; let osmLayer = null; let satelliteLayer = null;'''
          if marker not in text:
              raise SystemExit('Expected basemap init hook was not found')

          insert_after = '''        L.Map.addInitHook(function () {\n            const mapInstance = this; let osmLayer = null; let satelliteLayer = null;\n            const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri', maxZoom: 19 });'''
          # Insert the aid heatmap hook immediately before the basemap hook, leaving all existing map logic intact.
          heat_hook = r'''        L.Map.addInitHook(function () {
            const mapInstance = this;
            const requestData = Array.isArray(window.CAMP_AID_REQUESTS) ? window.CAMP_AID_REQUESTS : [];
            const campsById = new Map((typeof CAMPS_DATA !== 'undefined' ? CAMPS_DATA : []).map(camp => [Number(camp.id), camp]));
            const validRequests = requestData.map(item => {
                const camp = campsById.get(Number(item.camp_id));
                const count = Number(item.request_count || 0);
                if (!camp || !Number.isFinite(Number(camp.latitude)) || !Number.isFinite(Number(camp.longitude)) || count <= 0) return null;
                return {
                    camp,
                    count,
                    lat: Number(camp.latitude),
                    lng: Number(camp.longitude),
                };
            }).filter(Boolean);

            let heatLayer = null;
            let popupLayer = null;
            let enabled = true;

            const renderAidHeatmap = function () {
                if (heatLayer) {
                    mapInstance.removeLayer(heatLayer);
                    heatLayer = null;
                }
                if (popupLayer) {
                    mapInstance.removeLayer(popupLayer);
                    popupLayer = null;
                }
                if (!enabled || !validRequests.length || typeof L.heatLayer !== 'function') return;

                const maxCount = Math.max(...validRequests.map(item => item.count), 1);
                const points = validRequests.map(item => [
                    item.lat,
                    item.lng,
                    0.35 + (0.65 * item.count / maxCount),
                ]);

                heatLayer = L.heatLayer(points, {
                    radius: 48,
                    blur: 30,
                    maxZoom: 17,
                    minOpacity: 0.30,
                    max: 1.0,
                }).addTo(mapInstance);

                popupLayer = L.layerGroup();
                validRequests.forEach(function (item) {
                    const marker = L.circleMarker([item.lat, item.lng], {
                        radius: 12,
                        stroke: false,
                        fill: false,
                        opacity: 0,
                        fillOpacity: 0,
                        interactive: true,
                    });
                    marker.bindPopup(
                        '<div style="font-family:Cairo,sans-serif;direction:rtl;text-align:right;min-width:170px">' +
                        '<div style="font-weight:800;color:#1e3a5f;margin-bottom:5px">' + String(item.camp.name || 'المخيم') + '</div>' +
                        '<div>طلبات المساعدات: <strong style="color:#dc2626">' + item.count.toLocaleString('ar') + '</strong></div>' +
                        '</div>'
                    );
                    marker.addTo(popupLayer);
                });
                popupLayer.addTo(mapInstance);
            };

            const control = L.control({ position: 'topright' });
            control.onAdd = function () {
                const container = L.DomUtil.create('div', 'camp-aid-heat-control');
                container.innerHTML = '<button type="button" class="camp-aid-heat-btn active"><span class="camp-aid-heat-dot">🔥</span><span>طلبات المساعدات: تشغيل</span></button>';
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);
                const button = container.querySelector('.camp-aid-heat-btn');
                button.addEventListener('click', function () {
                    enabled = !enabled;
                    renderAidHeatmap();
                    button.classList.toggle('active', enabled);
                    button.innerHTML = '<span class="camp-aid-heat-dot">' + (enabled ? '🔥' : '⚪') + '</span><span>طلبات المساعدات: ' + (enabled ? 'تشغيل' : 'إيقاف') + '</span>';
                });
                return container;
            };
            control.addTo(mapInstance);

            renderAidHeatmap();
        });

'''
          text = text.replace(marker, heat_hook + marker, 1)

          style_marker = '''    .camp-hospital-place-btn, .camp-hospital-shp-btn {'''
          style = '''    .camp-aid-heat-control { background: transparent; margin-top: 6px; }\n    .camp-aid-heat-btn { border: 1px solid #fca5a5; border-radius: 9px; background: rgba(255,255,255,.97); color: #991b1b; padding: 8px 11px; font-family: 'Cairo', sans-serif; font-size: 11px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,.18); direction: rtl; min-width: 178px; }\n    .camp-aid-heat-btn:hover { background: #fff7ed; border-color: #f97316; }\n    .camp-aid-heat-btn.active { background: #fff1f2; border-color: #ef4444; color: #b91c1c; }\n    .camp-aid-heat-dot { margin-left: 5px; }\n'''
          if style_marker not in text:
              raise SystemExit('Expected style marker was not found')
          text = text.replace(style_marker, style + style_marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-aid-heatmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/MapController.php .github/workflows/apply-aid-heatmap.yml
          git commit -m "Add aid request heatmap to camp map"
          git push origin main
