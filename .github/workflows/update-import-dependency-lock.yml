name: Update import dependency lock

on:
  push:
    branches:
      - fix/import-excel-csv-formats

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2

      - name: Update SimpleXLS lock entry
        run: composer update shuchkin/simplexls --with-dependencies --no-interaction --prefer-dist

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No lock changes needed"
            exit 0
          fi
          git commit -m "chore: lock XLS import dependency"
          git push
